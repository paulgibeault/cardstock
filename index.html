<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cardstock</title>
  <meta name="description" content="One engine, many card games — each one a pack." />
  <meta name="theme-color" content="#1b5e3a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="src/ui/table.css" />

  <!-- The evergreen alias, root-relative — GAME_INTEGRATION §2. Not the
       major-pinned /sdk/v3/ form: evergreen is the deliberate fleet posture
       and every shipped app uses it. Root-relative also resolves under the
       launcher's local dev staging with no rewrite. -->
  <script src="/arcade-sdk.js"></script>

  <!-- The shared physical-gesture element library, then this game's sound
       pack. Both are classic scripts so they evaluate before src/main.js's
       module graph, which is what lets src/arcade/audio.js register at import
       time. A missing arcade-audio.js is a supported state: the pack simply
       does not register and the game is silent (§5 — a pack-based game does
       not degrade to chiptune). -->
  <script src="/arcade-audio.js"></script>
  <script src="js/soundpack.js"></script>

  <script>Arcade.init({ gameId: 'cardstock' });</script>
</head>
<body>
  <!-- Two screens in one document, swapped by the router in src/main.js. Both
       are present from the first paint so every element lookup can happen at
       module load; only their `hidden` flags move. -->

  <main id="lobby" hidden>
    <header class="lobby__header">
      <h1 class="wordmark">Cardstock</h1>
      <!-- The suits are the ornament, drawn from the same glyphs the card
           renderer uses. No webfont, and so no third-party asset. -->
      <p class="wordmark__rule" aria-hidden="true"><span>♠</span><span>♥</span><span>♦</span><span>♣</span></p>
      <p id="lobby-note" class="lobby__note"></p>
      <!-- The multiplayer door. Hidden outside a party and DISABLED, with its
           own label, on a launcher too old to carry the frames — the two are
           different sentences and src/match/peerPort.js keeps them apart. -->
      <button type="button" id="party-button" class="ghost-button party-button" hidden>Play together</button>
    </header>
    <!-- TABLES ARE NOT GAMES, and they go above them. A game tile is a thing
         you could start; a table tile is a thing already happening, with people
         at it. Filled by src/ui/party.js, which is the only module that knows a
         table exists — the lobby publishes the anchor and something else fills
         it, exactly as it does for the per-tile party ribbon below.

         Hidden until there is one, so a solo player's lobby is unchanged. -->
    <section id="tables-row" class="tables" hidden aria-labelledby="tables-heading">
      <h2 id="tables-heading" class="tables__heading">Tables</h2>
      <div id="tables-grid" class="tables__grid"></div>
    </section>
    <div id="lobby-grid" class="lobby__grid"></div>
  </main>

  <!-- The party: who is at the table, and what this device may do about it. The
       host sees bot/open toggles, a joiner sees claim buttons, and both see the
       same presence chips — drawn from the roster the HOST publishes, because on
       a joiner `peers()` holds only the host and a fellow joiner's silence is
       not absence.

       AN OVERLAY, NOT A THIRD SCREEN. It was a screen, and being a screen made
       it invisible: the router owns `hidden` on exactly two elements, so this
       one unhid itself BELOW the lobby grid and the only way to find it was to
       scroll past five game tiles. It is also the wrong shape for the job — the
       thing underneath is the context ("who is joining WHAT"), and a table you
       are hosting must not be torn down to look at the seats. -->
  <div id="party-overlay" hidden>
    <div class="panel panel--wide">
      <div id="party-heading" class="panel__title"></div>
      <p id="party-summary" class="party__summary"></p>
      <p id="party-note" class="party__note" hidden></p>
      <div id="party-seats" class="party__seats"></div>
      <div id="party-actions" class="party__actions"></div>
      <div class="panel__actions">
        <button type="button" id="party-back" class="ghost-button">Close</button>
      </div>
    </div>
  </div>

  <!-- The host's answer to a seat that dropped for good. Not shown for an
       INTERRUPTED seat: that one keeps playing, and asking about it would turn
       a tunnel into a decision. -->
  <div id="party-decision" hidden>
    <div class="panel">
      <div class="panel__title">Somebody left</div>
      <p id="party-decision-text"></p>
      <div class="panel__actions">
        <button type="button" data-choice="bot">Fill with a bot</button>
        <button type="button" data-choice="pause" class="ghost-button">Wait for them</button>
        <button type="button" data-choice="end" class="ghost-button">End the table</button>
      </div>
    </div>
  </div>

  <!-- Where an emote lands and then stops existing. Never logged, never
       persisted: an index on the wire, a glyph for a second and a half. -->
  <div id="emote-layer" class="emote-layer" aria-hidden="true"></div>

  <div id="table-screen" hidden>
    <!-- Three items, one line, always. The bar sits above the felt in a
         viewport-capped flex column, so a bar that grows a second line pushes
         the whole table down under the player's hand mid-turn. Nothing here
         may wrap, and nothing else belongs here: the variant's name is in the
         launcher title bar, and abandoning a game is the lobby's door
         (src/ui/lobby.js, the tile's "Start over"). -->
    <div id="status-bar">
      <button id="lobby-button" class="ghost-button" aria-label="Back to the lobby">
        <span aria-hidden="true">←</span> Lobby
      </button>
      <span id="status-text">Loading…</span>
      <!-- Your score, always on screen, and the way into the full sheet.
           A number you have to open a menu to see is a number you stop
           checking. -->
      <!-- The slot the human's own BOARD goes in, where the pack's primary
           counter is a position rather than a quantity (a cribbage board).
           Empty and display:none for every other pack, so the chip is the
           same pill it has always been. See renderStatusBar. -->
      <button type="button" id="score-chip" class="score-chip" hidden>
        <span class="score-chip__label">You</span>
        <span id="score-chip-track" class="score-chip__track" aria-hidden="true"></span>
        <span id="score-chip-value"></span>
      </button>
    </div>

    <!-- Presence, above the felt rather than on the seat faces: the opponent
         row is the pack's own furniture and a chip on it would move with every
         plate. One line, only while a party is live, and empty of bots and open
         seats — a chip that always says the same thing is not a chip. -->
    <div id="party-strip" class="party-strip" hidden></div>

    <div id="table">
      <!-- THE ONE MARK ON THE FELT THAT IS NOT A MOVE (#155).
           The rules used to live behind the scoreboard, two taps in, and the
           Hint lamp lived in the hand rail among the buttons that commit — so
           a player who did not know what game they were looking at had nothing
           on the felt to reach for, and a player who did had "what should I
           do?" sitting next to "Pass". Both questions are about the game
           rather than controls of it, and they are here together.

           Tucked into the corner the way the seat-view toggle is (see
           .opponent-row__toggle): out of the seat row's flow, above the felt
           and below every dialog, far enough into the corner that it covers
           neither a player nor the hand. The LEFT corner because the toggle
           has the right one, and it stays there under both handednesses for
           the same reason — this is not a control the thumb reaches for
           mid-trick, and a mark that mirrored would land on top of the
           toggle. -->
      <button type="button" id="help-button" class="table-help"
              aria-expanded="false" aria-controls="help-sheet" aria-label="Help">
        <span aria-hidden="true">?</span>
      </button>
      <!-- Two things, and deliberately not a menu: a menu promises arrow-key
           navigation and a roving tabstop, and two buttons in a popover that
           Tab already walks promise nothing they do not keep. Escape and a tap
           anywhere else close it, as everything else on this screen does. -->
      <div id="help-sheet" class="help-sheet" role="group" aria-labelledby="help-button" hidden>
        <button type="button" id="help-rules" class="help-sheet__item">
          <span class="help-sheet__label">How to play</span>
          <span class="help-sheet__note">The rules for this pack</span>
        </button>
        <!-- The hint is OFFERED OR EXPLAINED, never simply missing: a control
             that vanishes teaches nobody why. Disabled with the reason on it
             when the felt cannot answer — it is not your turn, the table holds
             a view rather than the cards, there is only one play. -->
        <button type="button" id="help-hint" class="help-sheet__item">
          <span class="help-sheet__label">Hint</span>
          <span id="help-hint-note" class="help-sheet__note">What a player at this level would do</span>
        </button>
      </div>

      <div class="opponent-row" id="opponents-top"></div>

      <!-- The contract in force: the standing high bid and who holds it during
           an auction, then the trump suit, the contract and your own meld
           (src/ui/contractStrip.js). Rendered only for a pack whose template
           answers `contractChips` — every other table keeps the row's height.
           Above the felt's middle rather than beside the piles, because a
           player checks trump between plays and the middle is where their eyes
           already are. -->
      <div id="table-contract" class="contract-strip" hidden></div>

      <!-- The middle of the felt: the ladder standing beside the piles rather
           than above them. Horizontal room is what a table runs out of first —
           the ladder used to take a whole row of the felt's HEIGHT to say ten
           short things that stack perfectly well — so it reads as a column
           down the left and gives the piles the vertical space back. -->
      <div id="felt-middle">
        <!-- THE SHOW, DRAWN (src/ui/showCard.js). One scoring step of cribbage's
             show — the name, the five faces, the combinations and the total —
             over the middle of the felt, where the banner band would be and
             where the piles already are. Decorative, like #event-banner it
             replaces: #log carries the same sentence. In here rather than in
             #table so it can never reach the hand: the fan is the one thing a
             player may still be looking at, and an overlay sized to the felt's
             middle is one that cannot cover it at any viewport. -->
        <div id="show-card" hidden></div>

        <!-- The contract ladder: every rung of a contract-rummy race, with each
             player's face on the one they are standing on. Rendered only for
             packs that declare `rules.contracts`; hidden for everything else. -->
        <div id="contract-ladder" hidden></div>

        <!-- Every pile the open pack's shared zones call for — draw, discard,
             trick, build.1..N — drawn from the zone definitions themselves
             (src/ui/table.js renderCenterZones). The draw pile IS the draw
             control where drawing is a move: reaching for the stock is how
             drawing works at a real table, and it puts the card's flight start
             under the finger that asked for it. -->
        <div id="center-piles"></div>

        <!-- THE BOARD: every seat's pegs on one road (src/ui/sharedBoard.js),
             for packs whose seat counters are POSITIONS rather than quantities.
             Hidden with no reserved slot for every other pack.

             Beside the piles where the middle is wide enough to hold it, and
             wrapped onto its own full-width line directly under them where it
             is not — one rule, decided by the flexbox, because the room is
             genuinely there on a desktop and genuinely is not on a phone. The
             wrap is switched on by `felt-middle--boarded` and therefore only
             ever applies to a table that HAS a board; every other pack's middle
             is the single unwrapped row it has always been. -->
        <div id="table-board" hidden></div>

        <!-- THE SEQUENCE THE TABLE IS PLAYING, in one place (#138). A zone the
             pack declares `table: true` on is per-player and still is — every
             seat keeps its own pile, which is what cribbage's count, its "go"
             and its show all read — but every seat's INSTANCE of it is drawn
             here, side by side and full size, instead of one copy above your
             hand and a 24px mini pile on each opponent's plate. Runs and pairs
             in cribbage are made ACROSS both players' cards; a sequence split
             between two ends of the felt is one nobody can count.

             The count that belongs to that sequence rides with it rather than
             beside the starter, which is why `#table-counters` moved in here.
             The pair is one full-width line of the middle whenever there are
             spreads on it, and collapses to the old content-sized slot beside
             the piles for a pack that has a table counter and no such zone. -->
        <div id="table-play" class="table-play" hidden>
          <div id="table-zones"></div>

          <!-- What the TABLE is counting, as opposed to what a seat is: the
               running count in cribbage's play. Rendered from the template's
               `tableCounters` and hidden — with no slot reserved — for every
               pack that declares none. -->
          <div id="table-counters" class="table-counters" hidden></div>
        </div>
      </div>

      <!-- YOUR OWN BAND OF THE FELT: the piles that are yours and the tray you
           gather into, which on a short window share one row instead of taking
           two (#137). A plain wrapper with `display: contents` everywhere else,
           so the felt's flex column is exactly what it was — the row only forms
           where the sheet says so, and only when both halves are really there.
           #announce-bar and #emote-bar are inside it to keep the reading order
           they had; each takes a full line of the row when it is showing. -->
      <div id="player-row">
        <!-- The human's own piles beyond the hand: a Stockpile stock and
             discards, Milestones melds, a Hearts won pile. Empty (and
             collapsed) for packs whose only personal zone is the hand. -->
        <div id="player-piles"></div>

        <!-- Out-of-turn declarations: "Last card!", and whatever else a pack's
             `announcements` block offers (§E2). Separate from the action bar
             because these are legal when it is NOT your turn, which is the
             whole point of them — and the labels come from the pack, not from
             here. -->
        <div id="announce-bar" hidden></div>

        <!-- A fixed set of eight, indexed on the wire (src/match/protocol.js).
             There is no free-text channel at this table on purpose: free text
             is a moderation problem, a localisation problem and an XSS surface,
             and the whole feature is "let them know you saw that". -->
        <div id="emote-bar" class="emote-bar" hidden></div>

        <!-- Cards you have picked out but not yet committed — a meld you are
             assembling, the three you are about to pass. They leave the fan and
             wait here, which is what makes the next pick easier: the fan opens
             up as it empties, and what you have gathered so far is legible at
             full size instead of being read off slivers. A VIEW of the
             selection, never state of its own (renderStageTray). -->
        <div id="stage-row" hidden>
          <div id="stage-tray" role="group"></div>
        </div>
      </div>

      <!-- THE RAIL, and why nothing stands above the hand any more.
           Everything that used to live in a bar between the felt and the fan
           — the turn token, the phase sentence, the Hint offer, the one
           action button — is here in a column at the fan's edge, or gone.
           That bar reserved 53px of the felt's height on a phone whether or
           not it had anything to say, and it said it directly above the cards
           the player was reaching for; the felt is short enough that the room
           was worth more than the words.

           WHAT IS IN IT NOW IS PLAY, AND ONLY PLAY: the turn token, the fan's
           sort toggle, the action button. The Hint offer left for the help
           mark in the felt's corner (#155) — "what should I do?" is a question
           about the game rather than a control of it, and it belongs beside
           "how do I play this?" rather than among the buttons that commit.

           The token is an ICON: a chip either lit or not, the same chip the
           seats wear, so "whose turn" is read the same way here as it is up
           there and it needs no label.

           WIDTH IS ALL THIS COSTS, and that is enforced rather than hoped
           for: the rail's own box is zero-height, so #hand-row is exactly as
           tall as the fan at every viewport, and layoutHand subtracts the
           RAIL rather than whichever control happens to be standing in it, so
           the fan keeps the room it had whatever the turn is doing. -->
      <div id="hand-row">
        <div class="hand" id="hand"></div>
        <!-- Two elements, because the rail owes the row a WIDTH and must never
             owe it a HEIGHT: the outer box is zero-height and the stack hangs
             off its bottom edge, out of flow. See .hand-rail in table.css. -->
        <div id="hand-rail" class="hand-rail">
          <div class="hand-rail__stack">
            <!-- THE turn marker, the same chip the seats wear. Never `hidden`:
                 it keeps its slot and only stops being visible, so the column
                 below it never shuffles upward when the turn changes hands —
                 these are controls under a thumb that is already reaching. -->
            <span class="turn-token" aria-hidden="true"></span>
            <!-- Arrange your own fan. Presentation only — src/ui/handOrder.js
                 explains at length why this never reaches the engine.

                 IT HAS ITS OWN SLOT NOW, and the Hint lamp that used to stand
                 here paid for it (#154, #155). The toggle and the action button
                 shared one slot, so a bid, a pass, a crib discard or a staged
                 combination took the sort control off the felt for the whole
                 phase — exactly when a player is arranging their hand to decide
                 (#154). The lamp moved to the help mark in the felt's corner,
                 which freed the third slot the stack was already the height of:
                 the rail is the same 5rem wide and the stack the same three
                 rungs tall as it was with the lamp in it, so nothing the felt
                 pays for changed. -->
            <button type="button" id="hand-sort" class="hand-sort"></button>
            <!-- The thumb slot: the one action that needs a button — passing,
                 laying down, committing a bid. It is the LAST rung because it
                 is the one the thumb is already reaching for, and it keeps its
                 slot when there is no action the same way the token keeps its
                 own: by class, never by `hidden`, so the column above it never
                 shuffles under a finger mid-turn. -->
            <button type="button" id="action-button"></button>
          </div>
        </div>
      </div>
    </div>

    <div id="log" role="status" aria-live="polite"></div>

    <!-- Trick celebrations and other table moments. Decorative by
         construction: #log is the live region that says the same thing. -->
    <div id="event-banner" aria-hidden="true" hidden></div>
  </div>

  <div id="round-overlay" hidden>
    <!-- TAPPING THE PANEL DEALS (#150). The whole sheet is the button, not
         merely the button — a player who has read the score reaches for the
         thing they are looking at. "End match" and the pace control opt out of
         that in src/ui/panels.js, because a tap meant for either of them must
         not be swallowed by the deal. -->
    <div class="panel" id="round-panel">
      <div id="round-title" class="panel__title"></div>
      <div id="round-scores" class="round-scores"></div>
      <!-- The round summary is the one moment a player is actually deciding
           whether to keep going, so it is where leaving belongs. Without it,
           a match that runs to 500 points offers no exit but closing the
           table, which keeps the game in progress and waiting in the lobby. -->
      <div id="round-target" class="round-target"></div>
      <div class="panel__actions">
        <!-- The countdown, drawn ON the button it is counting down to rather
             than beside it as digits: the fact worth showing is "this is about
             to happen", and a number turns that into arithmetic. The two rects
             are sized from the button by src/ui/panels.js — the outline has to
             match a pill whose width is the round number's, and the geometry is
             a measurement, not a constant. -->
        <span class="deal-ring-wrap">
          <svg id="round-ring" class="deal-ring" aria-hidden="true" hidden focusable="false">
            <rect class="deal-ring__track" x="0" y="0" width="100%" height="100%"></rect>
            <rect class="deal-ring__fill" x="0" y="0" width="100%" height="100%"></rect>
          </svg>
          <button id="round-continue">Deal the next round</button>
        </span>
        <button id="round-end-match" class="ghost-button">End match</button>
      </div>
      <!-- Changing the pace AT THE MOMENT YOU FEEL IT, rather than in a sheet
           two screens away that you next see when the match is over. -->
      <button type="button" id="round-pace" class="round-pace"></button>
    </div>
  </div>

  <!-- A wild's question, asked with cards rather than with words. The card you
       just played sits at the top, the options under it are drawn by the same
       renderer that drew it (src/ui/cardStyles/chooser.js), and the panel
       lights up in whichever one is under the finger. -->
  <div id="choice-modal" hidden>
    <div class="panel choice-dialog" id="choice-dialog" role="dialog" aria-modal="true"
         aria-labelledby="choice-prompt">
      <div id="choice-card" class="choice-dialog__card" aria-hidden="true" hidden></div>
      <div id="choice-prompt" class="panel__title"></div>
      <div id="choice-options" class="choice-grid"></div>
      <button id="choice-cancel" class="ghost-button">Cancel</button>
    </div>
  </div>

  <div id="confirm-modal" hidden>
    <div class="panel">
      <div id="confirm-message" class="panel__title"></div>
      <div class="panel__actions">
        <button id="confirm-cancel" class="ghost-button">Keep playing</button>
        <button id="confirm-ok" class="danger-button">Start over</button>
      </div>
    </div>
  </div>

  <!-- The running score sheet, openable at any time from the status bar. Its
       per-round history is computed from the match log on open
       (src/stats/matchStats.js) rather than tallied as the game goes. -->
  <div id="scoreboard-overlay" hidden>
    <div class="panel panel--wide">
      <div class="panel__title">Scores</div>
      <div id="scoreboard-totals" class="round-scores"></div>
      <div id="scoreboard-history" class="round-history"></div>
      <div class="panel__actions">
        <button id="scoreboard-close">Close</button>
        <button id="scoreboard-rules" class="ghost-button">How to play</button>
      </div>
    </div>
  </div>

  <!-- The new-game sheet: house rules and seat count, chosen before the deal
       because both are part of the rule set a match is replayed under and
       neither can change once cards are out (src/ui/newGame.js). -->
  <div id="new-game-overlay" hidden>
    <div class="panel">
      <div id="new-game-title" class="panel__title"></div>
      <div id="new-game-body" class="new-game__body"></div>
      <div class="panel__actions">
        <button id="new-game-deal">Deal</button>
        <button id="new-game-cancel" class="ghost-button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- How to play, generated from the pack's own declarations rather than
       written per game (src/ui/rules.js). Reachable from a lobby tile and
       from the scoreboard — deliberately NOT from the status bar, which is
       three items on one line and stays that way. -->
  <div id="rules-overlay" hidden>
    <div class="panel panel--wide">
      <div id="rules-title" class="panel__title"></div>
      <div id="rules-tagline" class="rules__tagline"></div>
      <div id="rules-body" class="rules__body"></div>
      <div class="panel__actions">
        <button id="rules-close">Close</button>
      </div>
    </div>
  </div>

  <!-- The last card, left on the table.
       A match ends the instant somebody's hand empties, and the results panel
       used to land on that instant — so the play that actually won it was
       covered before anyone had looked at it. This is the beat in between: no
       scrim, nothing over the felt, just a pill saying what happened and one
       way forward. The felt underneath stays live, so the winning card can
       still be held and inspected while this waits. -->
  <div id="final-look" hidden>
    <div class="final-look__bar">
      <p id="final-look-result" class="final-look__result"></p>
      <p id="final-look-play" class="final-look__play"></p>
      <button type="button" id="final-look-continue">See the results</button>
    </div>
  </div>

  <div id="game-over-overlay" hidden>
    <div class="panel panel--wide">
      <div id="game-over-fan" class="game-over-fan" aria-hidden="true"></div>
      <div id="game-over-message"></div>
      <div id="game-over-record"></div>
      <div id="game-over-stats" class="stats-grid"></div>
      <button type="button" id="game-over-rounds-toggle" class="ghost-button" aria-expanded="false" hidden>
        Round by round
      </button>
      <div id="game-over-rounds" class="round-history" hidden></div>
      <div class="panel__actions">
        <button id="game-over-lobby-button" class="ghost-button">Lobby</button>
        <button id="play-again-button">Play again</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>

  <script>
    // Fire-and-forget, never awaited on the boot path (§10). Inside a launcher
    // frame the SDK hands back an inert navigator.serviceWorker stub whose
    // register() rejects catchably — a game's worker only ever controls
    // STANDALONE visits, because an opaque-origin frame cannot be controlled by
    // any service worker at all. The loopback guard keeps local-dev edits from
    // being masked by stale cache, matching the launcher's own behaviour.
    try {
      if ('serviceWorker' in navigator &&
          !/^(127\.|localhost$|0\.0\.0\.0$|::1$)/.test(location.hostname)) {
        navigator.serviceWorker.register('sw.js', { scope: '/cardstock/' })
          .catch((e) => console.debug('[cardstock] service worker not registered', e && e.message));
      }
    } catch (e) { /* opaque-origin property access can throw outright */ }
  </script>
</body>
</html>
