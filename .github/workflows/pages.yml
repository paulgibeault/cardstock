# Thin caller for the fleet CI/CD standard. The pipeline lives in the
# launcher repo (fleet-ci.yml); change it there and every app follows.
# See GAME_INTEGRATION.md §13a.
name: CI & Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # version_bump pushes the bump commit back to main
  pages: write
  id-token: write

# Per-ref, so a PR run never cancels main's deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: paulgibeault/paulgibeault.github.io/.github/workflows/fleet-ci.yml@main
    with:
      # The fleet norm for any app with a service worker: CI owns the cache
      # version (§10).
      version_bump: true

      # The §13 checklist as a per-push gate. `launcher: true` checks the
      # launcher out and runs `npm run acceptance` (in THIS repo —
      # tools/acceptance.mjs) after our own tests. It covers the surface that
      # only breaks from the launcher side and that our own tests can never
      # see: bridged storage, the settings snapshot, suspend/resume, the caps
      # contract.
      #
      # ITS ONE PREREQUISITE IS UPSTREAM, NOT HERE. CI checks the launcher out
      # fresh from that repo's `main`, so the run is only green once
      # `cardstock` is in its catalog.json — without the tile there is nothing
      # to launch the game from and the framed-boot check fails with "launcher
      # has no .launcher-btn[data-game-id=cardstock]". That is a correct
      # signal rather than a flake: registration is real, and this flag is
      # step 3 of ARCADE_ENHANCEMENTS.md Phase 6 precisely because step 1 is
      # the catalog entry.
      launcher: true
      # The checklist runner is Playwright-driven and the test tier installs
      # no browsers unless asked.
      browsers: chromium
